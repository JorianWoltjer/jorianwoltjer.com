[package]
name = "app"
version = "0.1.0"
edition = "2021"
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8.9", features = ["macros", "ws", "form"] }
tower-sessions = "0.15.0"
bcrypt = "0.19.1"
chrono = { version = "0.4.44", features = ["serde"] }
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "chrono"] }
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.10", features = ["trace", "cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
markdown = "1.0.0"
dotenvy = "0.15.7"
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
schemars = { version = "1.2.1", features = ["chrono04"] }
futures = "0.3.32"
askama = "0.16.0"
tower = "0.5.3"
syntect = { version = "5.3", features = ["default-fancy"] }
html-escape = "0.2.13"
clap = { version = "4.6.1", features = ["derive"] }
pathdiff = "0.2.3"
indicatif = "0.18.4"
grass = "0.13.4"
rpassword = "7.5.2"
urlencoding = "2.1.3"
fancy-regex = "0.18.0"
reqwest = { version = "0.13.3", features = ["blocking"] }
